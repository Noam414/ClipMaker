[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmaker"
version = "0.1.0"
description = "Turn long videos into short vertical clips."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "sherpa-onnx>=1.10",
    "yt-dlp>=2026.10.26",  # YouTube/Twitch links (D-014, D-019); Unlicense
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
e2e = ["playwright>=1.44"]  # then: python -m playwright install chromium

[project.scripts]
clipmaker = "clipmaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipmaker = ["web/templates/*.html", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
